[Service]
# All Claude sessions, subagents and the commands they run live in this cgroup.
# Hitting MemoryHigh throttles only these processes; MemoryMax OOM-kills inside this cgroup
# (largest first), never the rest of the Pi.
MemoryHigh=infinity
MemoryMax=3600M
MemorySwapMax=512M
CPUQuota=200%
CPUWeight=30
TasksMax=2048
