[Slice]
# Aggregate cap for everything christopherklint runs (Claude/HAPI sessions, agents, codex, builds
# started from a shell). Docker work started by these tools goes to claude-heavy.slice
# (1.9G). Together they leave >=2.3G RAM and >=1 CPU core for production services and the OS.
CPUQuota=200%
CPUWeight=40
IOWeight=40
MemoryHigh=infinity
MemoryMax=4200M
MemorySwapMax=768M
TasksMax=4096
